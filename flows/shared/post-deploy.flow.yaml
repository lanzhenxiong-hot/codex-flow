name: post-deploy
description: "Shared post-deployment verification"
steps:
  - id: smoke-test
    name: "Smoke Test"
    type: shell
    command: "curl -sf https://health.example.com/health && echo OK"
    timeout: 30000

  - id: notify
    name: "Send Notification"
    type: http
    command: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"
    input:
      env:
        method: "POST"
        Content-Type: "application/json"
    content: '{"text": "Deploy completed successfully"}'
