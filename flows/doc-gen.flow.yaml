name: doc-gen
description: "Generate and update project documentation"
variables:
  target: "src/"
  output_dir: "docs/"
steps:
  - id: scan
    name: "Scan Source Files"
    type: shell
    command: "find {{target}} -name '*.ts' -o -name '*.py' | head -50"
    output:
      saveAs: file_list
  - id: generate-readme
    name: "Generate README"
    type: codex
    prompt: "Generate a comprehensive README.md: overview, installation, usage, API reference, contributing guide."
  - id: generate-docstrings
    name: "Add Docstrings"
    type: codex
    prompt: "For each public function/class, ensure clear docstrings. Only add missing ones."
  - id: validate
    name: "Validate Docs"
    type: shell
    command: "npx markdown-link-check README.md || true"
